pg:
  write:
    - name: master1
      url: jdbc:postgresql://master1.db:5432/app
      username: writer
      password: secret
      isDefault: true
      driver-class-name: org.postgresql.Driver
      hikari:
        minimum-idle: 3
        maximum-pool-size: 5
        idle-timeout: 30000
        max-lifetime: 1800000
        connection-timeout: 60000
        pool-name: Master1Pool
    - name: master2
      url: jdbc:postgresql://master2.db:5432/app
      username: writer
      password: secret
      driver-class-name: org.postgresql.Driver
      hikari:
        minimum-idle: 3
        maximum-pool-size: 5
        idle-timeout: 30000
        max-lifetime: 1800000
        connection-timeout: 60000
        pool-name: Master2Pool
  read:
    - name: slave1
      url: jdbc:postgresql://slave1.db:5432/app
      username: reader
      password: secret
      driver-class-name: org.postgresql.Driver
      hikari:
        minimum-idle: 3
        maximum-pool-size: 5
        idle-timeout: 30000
        max-lifetime: 1800000
        connection-timeout: 60000
        pool-name: Slave1Pool
    - name: slave2
      url: jdbc:postgresql://slave2.db:5432/app
      username: reader
      password: secret
      driver-class-name: org.postgresql.Driver
      hikari:
        minimum-idle: 3
        maximum-pool-size: 5
        idle-timeout: 30000
        max-lifetime: 1800000
        connection-timeout: 60000
        pool-name: Slave2Pool

  jpa:
    enabled: true
    properties:
      hibernate:
        format_sql: false
        jdbc.batch_size: 50
        order_inserts: true
        order_updates: true
        hbm2ddl:
          auto: validate

  pg:
  mybatis:
    enabled: true
    configuration:
      map-underscore-to-camel-case: true
      default-statement-timeout: 5
      cache-enabled: false
      log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
    type-aliases-package:
      - com.agitg.auth.domain.model
    mapper-locations:
      - classpath*:mapper/*.xml
    mapper-scan-packages:
      - com.agitg.auth.infrastructure.mybatis.mapper
      - com.agitg.auth.dao.mapper
