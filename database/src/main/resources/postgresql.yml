# SharedUtility database example.
#
# Single-node mode is recommended for local/dev/small standalone deployment.
# Cluster mode is recommended for production read/write separation.
# Configure exactly one mode in the real application.yml.

pg:
  enabled: true
  single:
    name: single
    url: jdbc:postgresql://localhost:5432/app
    username: app
    password: ${PG_PASSWORD}
    isDefault: true
    driver-class-name: org.postgresql.Driver
    hikari:
      minimum-idle: 3
      maximum-pool-size: 10
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 30000
      pool-name: PgSinglePool

  jpa:
    enabled: false

  mybatis:
    enabled: true
    configuration:
      map-underscore-to-camel-case: true
      default-statement-timeout: 5
      cache-enabled: false
      log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
    type-aliases-package:
      - com.example.domain
    mapper-locations:
      - classpath*:mapper/**/*.xml
    mapper-scan-packages:
      - com.example.mapper
